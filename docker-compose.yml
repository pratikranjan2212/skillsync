services:
  postgres:
    image: postgres:16-alpine
    container_name: skillsync_postgres
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-skillsync}
    ports:
      # Restrict port binding exclusively to localhost loopback (127.0.0.1)
      # to prevent public internet access to the database container
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skillsync}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
